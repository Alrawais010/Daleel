name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir -p ~/.android
          KS=~/.android/debug.keystore
          curl -sL https://raw.githubusercontent.com/Alrawais010/Weladat/main/.github/workflows/apk.yml | grep -o 'echo "MII[^"]*"' | cut -d'"' -f2 | base64 -d > $KS || true
          [ -s $KS ] || keytool -genkeypair -keystore $KS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 10000 -dname "CN=Android"
          REPO="${GITHUB_REPOSITORY#*/}"
          NAME="$(tr -d '\r\n' < appname.txt)"
          ID="com.alrawais010.$(echo "$REPO" | tr 'A-Z' 'a-z')"
          B="$RUNNER_TEMP/b"
          mkdir -p "$B/www"
          cp index.html "$B/www/"
          cd "$B"
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/geolocation@7
          npx cap init "$NAME" "$ID" --web-dir www
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' $M
          npx cap sync android
          cd android
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file=$KS -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$REPO.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          gh release delete apk-latest -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest "$REPO.apk" --repo "$GITHUB_REPOSITORY" --title "APK" --notes "APK"
